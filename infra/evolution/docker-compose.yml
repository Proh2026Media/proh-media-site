# ============================================================================
# Evolution API v2 — pilha completa para a VPS.
#
# Quatro serviços:
#   caddy      — porta de entrada, cuida do HTTPS sozinho (Let's Encrypt)
#   evolution  — a API do WhatsApp em si
#   postgres   — guarda instâncias, contatos e mensagens
#   redis      — cache de sessão (deixa a reconexão mais rápida)
#
# Só o Caddy expõe portas para a internet (80/443). A API, o banco e o cache
# conversam pela rede interna do Docker — não ficam acessíveis de fora.
# ============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: proh-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - evolution
    networks: [proh]

  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: proh-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SERVER_URL: ${SERVER_URL}
      AUTHENTICATION_API_KEY: ${API_KEY}

      # Banco de dados
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: proh
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      # Cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: proh
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Comportamento
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR
      LOG_COLOR: "false"
      TELEMETRY: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks: [proh]

  postgres:
    image: postgres:16-alpine
    container_name: proh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [proh]

  redis:
    image: redis:7-alpine
    container_name: proh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [proh]

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  proh:
    driver: bridge
